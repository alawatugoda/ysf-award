name: Update Scimago Data

on:
  schedule:
    - cron: '0 2 1 * *'  # Every month 1st at 2am UTC
  workflow_dispatch:      # Manual trigger anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find latest Scimago CSV on Zenodo
        id: zenodo
        run: |
          # Zenodo concept DOI for Scimago dataset — always resolves to latest version
          RECORD=$(curl -sL "https://zenodo.org/api/records?q=scimago+journal+database&sort=mostrecent&size=1&communities=scimago" \
            | python3 -c "import json,sys; r=json.load(sys.stdin)['hits']['hits']; print(r[0]['id'] if r else '')" 2>/dev/null || echo "")

          # Fallback: use known Zenodo record for latest data
          if [ -z "$RECORD" ]; then
            # Try the known 2026 record first, fall back to searching
            CSV_URL="https://zenodo.org/records/19376203/files/01042026_journal_database.csv?download=1"
          else
            CSV_URL=$(curl -sL "https://zenodo.org/api/records/$RECORD" \
              | python3 -c "import json,sys; r=json.load(sys.stdin); files=r.get('files',[]); csv=[f for f in files if f['key'].endswith('.csv')]; print(csv[0]['links']['self'] if csv else '')" 2>/dev/null || echo "")
          fi

          echo "csv_url=$CSV_URL" >> $GITHUB_OUTPUT
          echo "Using CSV: $CSV_URL"

      - name: Download Scimago CSV
        run: |
          curl -L "${{ steps.zenodo.outputs.csv_url }}" -o scimago_raw.csv
          wc -l scimago_raw.csv

      - name: Convert CSV to JSON
        run: |
          python3 - << 'PYEOF'
          import csv, json, os

          issn_map = {}
          # Try semicolon delimiter first (Scimago format), then comma
          for delim in (';', ','):
              try:
                  with open('scimago_raw.csv', encoding='utf-8-sig') as f:
                      reader = csv.DictReader(f, delimiter=delim)
                      rows = list(reader)
                      if not rows:
                          continue
                      headers = list(rows[0].keys())
                      print(f"Headers ({delim}): {headers[:6]}")
                      for row in rows:
                          q = (row.get('SJR Best Quartile') or row.get('Quartile') or '').strip()
                          if q not in ('Q1','Q2','Q3','Q4'):
                              continue
                          for field in headers:
                              if 'issn' in field.lower():
                                  val = row.get(field, '')
                                  for issn in val.replace(' ','').split(','):
                                      issn = issn.strip().replace('-','')
                                      if len(issn) == 8 and issn.isdigit():
                                          if issn not in issn_map:
                                              issn_map[issn] = q
                      if issn_map:
                          break
              except Exception as e:
                  print(f"Error with delimiter '{delim}': {e}")
                  continue

          with open('scimago_issn.json', 'w') as f:
              json.dump(issn_map, f, separators=(',',':'))

          print(f"Done: {len(issn_map)} ISSNs written to scimago_issn.json")
          if len(issn_map) < 1000:
              print("WARNING: Very few ISSNs found — check CSV format!")
              exit(1)
          PYEOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scimago_issn.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            YEAR=$(date +%Y)
            git commit -m "Update scimago_issn.json from Scimago $YEAR data"
            git push
          fi
